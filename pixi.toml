[workspace]
authors = ["jtb <james.baker@vanderbilt.edu>"]
channels = ["conda-forge", "bioconda"]
name = "compadre"
platforms = ["linux-64", "osx-64"]
version = "0.1.0"

[tasks]
# install all of the perl dependencies that we need into the correct environment. Make sure no local directories are being used
install-cpan = """
env PERL5LIB="" PERL_LOCAL_LIB_ROOT="" PERL_MM_OPT="" PERL_MB_OPT="" cpanm --installdeps --notest .
"""
# Command to run compadre
run-compadre = """
env PERL5LIB="" PERL_LOCAL_LIB_ROOT="" PERL_MM_OPT="" PERL_MB_OPT="" perl bin/run_COMPADRE.pl
"""
# Command to run the test suite
test = "prove -Ilib/perl_modules -It/lib t/unit/*.t t/integration/*.t"

[dependencies]
python = "~=3.13.0"
pandas = ">=3.0.3,<4"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.10.9,<4"
scikit-learn = ">=1.9.0,<2"
plink = ">=1.90b7.7,<2"
plink2 = ">=2.0.0a.6.9,<3"
ghostscript = ">=10.7.1,<11"
perl = "~=5.3"
make = ">=4.4.1,<5"
perl-app-cpanminus = ">=1.7048,<2"
scipy = ">=1.17.1,<2"
r-base = "~=4.5.0"
r-kernsmooth = ">=2.23_26,<3"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.6,<0.15"
xopen = ">=2.1.0,<3"

[target.linux-64.dependencies]
gcc_linux-64 = ">=15.2.0,<16"
gxx_linux-64 = ">=15.2.0,<16"
